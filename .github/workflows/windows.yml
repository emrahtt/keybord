name: Windows build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore YazimAsistani.sln
      - run: dotnet test YazimAsistani.sln -c Release --no-restore
      - run: dotnet build YazimAsistani.sln -c Release --no-restore
      - run: ./scripts/publish-portable.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Yazim-Asistani-1.0.0-portable-win-x64
          path: |
            artifacts/portable-win-x64
            artifacts/Yazim-Asistani-1.0.0-portable-win-x64.zip

